---
- name: Install and configure HTTP server
  hosts: all
  become: true
  gather_facts: true

  tasks:

    - name: Install Apache on Debian/Ubuntu
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Install HTTPD on RedHat-based systems
      ansible.builtin.dnf:
        name: httpd
        state: present
      when: ansible_os_family == "RedHat"

    - name: Start and enable Apache on Debian/Ubuntu
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true
      when: ansible_os_family == "Debian"

    - name: Start and enable HTTPD on RedHat-based systems
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
      when: ansible_os_family == "RedHat"

    - name: Verify Apache service
      ansible.builtin.service_facts:

    - name: Display Apache service status
      ansible.builtin.debug:
        msg: "Web server installation completed successfully"
```
