- name: Try Apache removal and show full error
  ansible.builtin.command:
    cmd: apt-get remove -y apache2
  register: apache_remove
  failed_when: false

- name: Show apt stdout
  ansible.builtin.debug:
    var: apache_remove.stdout_lines

- name: Show apt stderr
  ansible.builtin.debug:
    var: apache_remove.stderr_lines

- name: Show dpkg status
  ansible.builtin.command:
    cmd: dpkg --audit
  register: dpkg_audit
  changed_when: false

- name: Display dpkg audit
  ansible.builtin.debug:
    var: dpkg_audit.stdout_lines
