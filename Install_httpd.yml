---
- name: Install and configure HTTP server
  hosts: all
  become: true
  gather_facts: true

  tasks:

    - name: Install Apache on Debian/Ubuntu
      ansible.builtin.apt:
        name: apache2
        state: absent
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Display Apache service status
      ansible.builtin.debug:
        msg: "Web server uninstalled successfully"
